<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小怡｜岁岁无虞</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-color: #080c18;
            overflow: hidden;
            font-family: "思源黑体", system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
        }
        #starfield{
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index: 0;
            opacity:0;
            transition: opacity 1.5s ease-in-out;
        }
        .nav-card {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 48px 40px;
            max-width: 420px;
            width: calc(100% - 40px);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(148, 163, 184, 0.12);
            border-radius: 16px;
            backdrop-filter: blur(12px);
            opacity:0;
            transform: translateY(12px);
            transition: all 1s ease;
        }
        .nav-card.show{
            opacity:1;
            transform: translateY(0);
        }
        .nav-card h1{
            font-size:24px;
            font-weight: 400;
            margin-bottom:12px;
            color:#e2e8f0;
            letter-spacing:2px;
        }
        .desc{
            font-size:14px;
            color:#94a3b8;
            margin-bottom:36px;
            line-height:1.7;
        }
        .nav-item{
            display:block;
            text-decoration:none;
            color:#cbd5e1;
            padding:14px 20px;
            margin:12px 0;
            border:1px solid rgba(148,163,184,0.2);
            border-radius:10px;
            font-size:16px;
            transition: 0.3s ease;
        }
        .nav-item:hover{
            border-color:#ecb6ca;
            background:rgba(236, 182, 202, 0.08);
            color:#f0c8d6;
        }
        .back-tip{
            margin-top:28px;
            font-size:13px;
            opacity:0.45;
        }
    </style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="nav-card" id="navWrap">
    <h1>小钧 & 小怡</h1>
    <div class="desc">属于我们的故事才刚刚开始</div>
    <a href="yifengxin.html" class="nav-item">✉️ 一封写给小怡的信</a>
    <a href="jishiqi.html" class="nav-item">💞 计时器</a>
    <div class="back-tip"></div>
</div>
<script>
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let w,h,stars = [];
let meteors = [];

function resize(){
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
}
resize();
window.addEventListener('resize',resize);

// 分层星星，带闪烁相位、视差速度
for(let i=0;i<650;i++){
    const layer = Math.random();
    let r,speed;
    if(layer <0.65){
        //远景小星星
        r = Math.random()*0.6+0.15;
        speed = Math.random()*0.08+0.02;
    }else if(layer<0.92){
        //中景
        r = Math.random()*1.1+0.35;
        speed = Math.random()*0.18+0.06;
    }else{
        //近景亮星
        r = Math.random()*1.8+0.6;
        speed = Math.random()*0.32+0.1;
    }
    stars.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:r,
        speed:speed,
        twinklePhase: Math.random()*Math.PI*2,
        twinkleSpeed: 0.015 + Math.random()*0.025
    })
}

function spawnMeteor(){
    const isFireball = Math.random()>0.88;
    meteors.push({
        x: Math.random() * w * 0.4 + w*0.6,
        y: Math.random() * h * 0.35,
        len: isFireball ? Math.random()*120+80 : Math.random()*70 +30,
        speedX: isFireball ? -2.2 : -(Math.random()*1.8+0.8),
        speedY: isFireball ? 2.2 : (Math.random()*1.8+0.8),
        opacity: isFireball ? 1.0 : (Math.random()*0.5+0.4),
        isFireball
    })
    //随机下一次流星时间
    setTimeout(spawnMeteor, 1200 + Math.random()*3200);
}
//启动流星
setTimeout(spawnMeteor,1000);

function draw(){
    ctx.fillStyle="#080c18";
    ctx.fillRect(0,0,w,h);
    const time = performance.now();
    stars.forEach(s=>{
        s.twinklePhase += s.twinkleSpeed;
        const twinkle = 0.35 + Math.sin(s.twinklePhase)*0.35;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(210,225,255,${twinkle})`;
        ctx.fill();
        s.y += s.speed;
        if(s.y>h){
            s.y = 0;
            s.x = Math.random()*w;
        }
    })

    for(let i = meteors.length -1; i >=0; i--){
        let m = meteors[i];
        //流星渐变尾迹
        const grad = ctx.createLinearGradient(m.x, m.y, m.x+m.len, m.y-m.len);
        grad.addColorStop(0,`rgba(255,255,255,${m.opacity})`);
        grad.addColorStop(1,`rgba(255,255,255,0)`);
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + m.len, m.y - m.len);
        ctx.strokeStyle = grad;
        ctx.lineWidth = m.isFireball ? 2.8 :1.4;
        ctx.stroke();

        m.x += m.speedX;
        m.y += m.speedY;
        m.opacity -= m.isFireball ? 0.0045 :0.0075;
        if(m.opacity <= 0){
            meteors.splice(i,1);
        }
    }
    requestAnimationFrame(draw);
}
draw();

const starfield = document.getElementById("starfield");
const navWrap = document.getElementById("navWrap");
window.addEventListener('load',()=>{
    starfield.style.opacity = "1";
    setTimeout(()=>{
        navWrap.classList.add('show');
    },600);
})
</script>
</body>
</html>
