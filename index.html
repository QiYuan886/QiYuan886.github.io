<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一封信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        body {
            min-height: 100vh;
            background-color: #080c18;
            overflow: hidden;
            font-family: "思源黑体", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
        }
        #starfield{
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index: 0;
            opacity:0;
            transition: opacity 1.5s ease-in-out;
        }
        .wrap{
            position: relative;
            z-index: 2;
            max-width: 550px;
            padding: 40px 30px;
            line-height: 2.2;
            font-size: 18px;
            display:none;
        }
        .line{
            min-height: 34px;
            margin: 16px 0;
            white-space: pre;
        }
        /* 落款右对齐 */
        .line-right{
            text-align: right;
        }
        .cursor{
            display: inline-block;
            width:8px;
            height:18px;
            background:#89a8d8;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink{
            0%,49%{opacity:1}
            50%,100%{opacity:0}
        }
        /* 初始封面 */
        .cover{
            z-index:3;
            text-align:center;
        }
        .cover h2{
            font-size:26px;
            margin-bottom:40px;
            font-weight:400;
        }
        .cover button{
            padding:12px 32px;
            font-size:16px;
            background:transparent;
            border:1px solid #94a3b8;
            color:#cbd5e1;
            border-radius:8px;
            cursor:pointer;
            transition: all 0.3s;
        }
        .cover button:hover{
            background:rgba(148,163,184,0.15);
            border-color:#b4c5de;
        }
    </style>
</head>
<body>
<canvas id="starfield"></canvas>

<!-- 初始封面 -->
<div class="cover" id="cover">
    <h2>To 怡怡</h2>
    <button id="openBtn"> >拆开< </button>
</div>

<!-- 书信内容，默认隐藏 -->
<div class="wrap" id="letter">
    <div class="line" id="p1"></div>
    <div class="line" id="p2"></div>
    <div class="line" id="p3"></div>
    <div class="line" id="p4"></div>
    <div class="line" id="p5"></div>
    <div class="line line-right" id="p6"></div>
    <div class="cursor"></div>
</div>

<script>
// 文案
const textList = [
    "To 怡怡：",
    "世界本是灰暗的",
    "直到遇见你，这一切，才慢慢有了色彩。",
    "我不善言辞，不奢远念。",
    "惟愿此番相遇，长久留存。",
    "by启元"
];
const doms = [p1,p2,p3,p4,p5,p6];
let idxLine = 0, idxChar = 0;
const speed = 80;

// 星空画布
const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let w,h,stars = [];
let meteors = [];

function resize(){
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
}
resize();
window.addEventListener('resize',resize);

for(let i=0;i<350;i++){
    stars.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*1.2+0.2,
        speed:Math.random()*0.25+0.05
    })
}

// 创建流星（在canvas内部绘制，从右上斜飞到左下）
function spawnMeteor(){
    meteors.push({
        x: Math.random() * w * 0.4 + w*0.6,
        y: Math.random() * h * 0.3,
        len: Math.random()*60 + 40,
        speedX: -1.2,
        speedY: 1.2,
        opacity: 1
    })
}

function draw(){
    ctx.fillStyle="#080c18";
    ctx.fillRect(0,0,w,h);
    // 静态星星
    stars.forEach(s=>{
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(210,225,255,${0.3+Math.random()*0.4})`;
        ctx.fill();
        s.y += s.speed;
        if(s.y>h){
            s.y = 0;
            s.x = Math.random()*w;
        }
    })

    // 绘制流星
    for(let i = meteors.length -1; i >=0; i--){
        let m = meteors[i];
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + m.len, m.y - m.len);
        ctx.strokeStyle = `rgba(255,255,255,${m.opacity})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        m.x += m.speedX;
        m.y += m.speedY;
        m.opacity -= 0.008;

        if(m.opacity <= 0){
            meteors.splice(i,1);
        }
    }

    requestAnimationFrame(draw);
}
draw();
// 每隔4秒生成一颗流星
setInterval(spawnMeteor,4000);

// 点击拆开信
const cover = document.getElementById("cover");
const letter = document.getElementById("letter");
const starfield = document.getElementById("starfield");
document.getElementById("openBtn").onclick = function(){
    cover.style.display = "none";
    starfield.style.opacity = "1";
    letter.style.display = "block";
    setTimeout(type,800);
}

// 打字机函数
function type(){
    if(idxLine >= textList.length) return;
    const txt = textList[idxLine];
    doms[idxLine].innerText = txt.substring(0,idxChar+1);
    idxChar++;
    if(idxChar >= txt.length){
        idxLine++;
        idxChar = 0;
        setTimeout(type, 700);
        return;
    }
    setTimeout(type, speed);
}
</script>
</body>
</html>
