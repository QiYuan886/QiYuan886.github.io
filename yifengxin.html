<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一封信</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background-color: #080c18;
            overflow: hidden;
            font-family: "思源黑体", system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cbd5e1;
        }
        #starfield{
            position: fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index: 0;
            opacity:0;
            transition: opacity 1.5s ease-in-out;
            pointer-events: none;
        }
        .wrap{
            position: relative;
            z-index: 2;
            max-width: 550px;
            padding: 20px 24px;
            line-height: 1.6; /* 缩小行高 */
            font-size: 16px;   /* 调小字号 */
            display:none;
        }
        .line{
            min-height: 22px;
            margin: 8px 0; /* 大幅缩小每行上下间距 */
            white-space: pre;
        }
        .line-right{
            text-align: right;
        }
        .cursor{
            display: inline-block;
            width:8px;
            height:16px;
            background:#89a8d8;
            animation: blink 0.7s infinite;
            vertical-align: text-bottom;
        }
        @keyframes blink{
            0%,49%{opacity:1}
            50%,100%{opacity:0}
        }
        .cover{
            z-index:3;
            text-align:center;
        }
        .cover h2{
            font-size:26px;
            margin-bottom:40px;
            font-weight:400;
        }
        .cover button{
            padding:12px 32px;
            font-size:16px;
            background:transparent;
            border:1px solid #94a3b8;
            color:#cbd5e1;
            border-radius:8px;
            cursor:pointer;
            transition: all 0.3s;
        }
        .cover button:hover{
            background:rgba(148,163,184,0.15);
            border-color:#b4c5de;
        }
        .back-box{
            margin-top:24px; /* 减少按钮上方距离 */
            text-align:center;
            display:none;
        }
        .back-btn{
            padding:10px 28px;
            font-size:15px;
            background:transparent;
            border:1px solid #ecb6ca;
            color:#ecb6ca;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }
        .back-btn:hover{
            background:rgba(236,182,202,0.08);
        }
    </style>
</head>
<body>
<canvas id="starfield"></canvas>
<div class="cover" id="cover">
    <h2>To 小怡</h2>
    <button id="openBtn"> >拆开< </button>
</div>
<div class="wrap" id="letter">
    <div id="linesContainer"></div>
    <span class="cursor"></span>
    <div class="back-box" id="backWrap">
        <button class="back-btn" id="backBtn"> >收下< </button>
    </div>
</div>
<script>
const textList = [
    "To 小怡：",
    "不知道你何时会翻开这封信。",
    "没能早点来到你身边，我一直心存遗憾。",
    "和你在一起的每个瞬间，我都觉得很幸福。",
    "我喜欢听你分享生活里琐碎的事；",
    "我喜欢你俏皮可爱的瞬间；",
    "我喜欢你温柔纯粹的性子；",
    "我喜欢你的一切。",
    "我才情浅薄，不善言辞，",
    "但字里行间流露的，却是我最真实的情感",
    "by 小钧"
];

const rightAlignIndex = textList.length -1;
const linesContainer = document.getElementById('linesContainer');
const letter = document.getElementById("letter");
let lineDoms = [];
textList.forEach((_,idx)=>{
    const div = document.createElement('div');
    div.className = "line";
    if(idx === rightAlignIndex){
        div.classList.add('line-right');
    }
    linesContainer.appendChild(div);
    lineDoms.push(div);
})

let idxLine = 0, idxChar = 0;
const speed = 80;

const canvas = document.getElementById('starfield');
const ctx = canvas.getContext('2d');
let w,h,stars = [];
let meteors = [];
function resize(){
    w = canvas.width = innerWidth;
    h = canvas.height = innerHeight;
}
resize();
window.addEventListener('resize',resize);
//分层星空+闪烁
for(let i=0;i<650;i++){
    const layer = Math.random();
    let r,speed;
    if(layer <0.65){
        r = Math.random()*0.6+0.15;
        speed = Math.random()*0.08+0.02;
    }else if(layer<0.92){
        r = Math.random()*1.1+0.35;
        speed = Math.random()*0.18+0.06;
    }else{
        r = Math.random()*1.8+0.6;
        speed = Math.random()*0.32+0.1;
    }
    stars.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:r,
        speed:speed,
        twinklePhase: Math.random()*Math.PI*2,
        twinkleSpeed:0.015+Math.random()*0.025
    })
}
function spawnMeteor(){
    const isFireball = Math.random()>0.88;
    meteors.push({
        x: Math.random() * w * 0.4 + w*0.6,
        y: Math.random() * h * 0.35,
        len: isFireball ? Math.random()*120+80 : Math.random()*70 +30,
        speedX: isFireball ? -2.2 : -(Math.random()*1.8+0.8),
        speedY: isFireball ? 2.2 : (Math.random()*1.8+0.8),
        opacity: isFireball ?1.0 : (Math.random()*0.5+0.4),
        isFireball
    })
    setTimeout(spawnMeteor, 1200 + Math.random()*3200);
}
setTimeout(spawnMeteor,900);
function draw(){
    ctx.fillStyle="#080c18";
    ctx.fillRect(0,0,w,h);
    const time = performance.now();
    stars.forEach(s=>{
        s.twinklePhase += s.twinkleSpeed;
        const twinkle = 0.35 + Math.sin(s.twinklePhase)*0.35;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = `rgba(210,225,255,${twinkle})`;
        ctx.fill();
        s.y += s.speed;
        if(s.y>h){
            s.y = 0;
            s.x = Math.random()*w;
        }
    })
    for(let i = meteors.length -1; i >=0; i--){
        let m = meteors[i];
        const grad = ctx.createLinearGradient(m.x,m.y,m.x+m.len,m.y-m.len);
        grad.addColorStop(0,`rgba(255,255,255,${m.opacity})`);
        grad.addColorStop(1,`rgba(255,255,255,0)`);
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + m.len, m.y - m.len);
        ctx.strokeStyle = grad;
        ctx.lineWidth = m.isFireball ?2.8:1.4;
        ctx.stroke();
        m.x += m.speedX;
        m.y += m.speedY;
        m.opacity -= m.isFireball ?0.0045:0.0075;
        if(m.opacity <= 0){
            meteors.splice(i,1);
        }
    }
    requestAnimationFrame(draw);
}
draw();

const cover = document.getElementById("cover");
const starfield = document.getElementById("starfield");
const backWrap = document.getElementById("backWrap");
const backBtn = document.getElementById('backBtn');

document.getElementById("openBtn").onclick = function(){
    cover.style.display = "none";
    starfield.style.opacity = "1";
    letter.style.display = "block";
    setTimeout(type,800);
}

backBtn.onclick = function(){
    window.location.href = "index.html";
}

function type(){
    if(idxLine >= textList.length) {
        setTimeout(()=>{
            backWrap.style.display = "block";
        },600);
        return;
    }
    const txt = textList[idxLine];
    lineDoms[idxLine].innerText = txt.substring(0,idxChar+1);
    idxChar++;
    if(idxChar >= txt.length){
        idxLine++;
        idxChar = 0;
        setTimeout(type, 700);
        return;
    }
    setTimeout(type, speed);
}
</script>
</body>
</html>
